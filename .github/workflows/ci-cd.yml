name: Build and deploy Python app to Azure Web App - python-projet



on:
  push:
    branches:
      - main
      - infra-test
      - ansible-docker

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create and start virtual environment
        run: |
          python -m venv venv
          source venv/bin/activate
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
        
      - name: Run tests
        run: |
          python -m unittest discover

      - name: Zip artifact for deployment
        run: zip -r release.zip . -x "venv/*"

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            release.zip
            !venv/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/infra-test' || github.ref == 'refs/heads/ansible-docker' }}
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      # Suppression de la création des clés ici (elles sont créées avant Terraform seulement)
      - name: Unzip artifact for deployment
        run: unzip -o -qq release.zip

      - name: Set Azure credentials
        run: |
          echo "ARM_CLIENT_ID=${{ secrets.AZUREAPPSERVICE_CLIENTID }}" >> $GITHUB_ENV
          echo "ARM_CLIENT_SECRET=${{ secrets.AZUREAPPSERVICE_CLIENTSECRET }}" >> $GITHUB_ENV
          echo "ARM_SUBSCRIPTION_ID=${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID }}" >> $GITHUB_ENV
          echo "ARM_TENANT_ID=${{ secrets.AZUREAPPSERVICE_TENANTID }}" >> $GITHUB_ENV

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
        env:
          SSH_KEY: ${{ secrets.SECRET_SSH_KEY }}


      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Add deploy_key.pub to workspace (avant Terraform)
        run: |
          mkdir -p infra
          echo "${{ secrets.DEPLOY_KEY_PUB }}" > infra/deploy_key.pub

      # Suppression de la création de la clé privée ici (inutile pour Terraform)

      - name: Init Terraform
        run: terraform -chdir=infra init

      - name: Destroy existing Azure infra (optionnel)
        run: terraform -chdir=infra destroy -auto-approve || true
        env:
          ARM_CLIENT_ID: ${{ secrets.AZUREAPPSERVICE_CLIENTID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZUREAPPSERVICE_CLIENTSECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID }}
          ARM_TENANT_ID: ${{ secrets.AZUREAPPSERVICE_TENANTID }}

      - name: Import ressources Azure existantes (idempotent)
        run: |
          set -e
          SUBSCRIPTION_ID="${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID }}"
          # Import NSG
          terraform -chdir=infra import azurerm_network_security_group.main "/subscriptions/$SUBSCRIPTION_ID/resourceGroups/projet-python-rg/providers/Microsoft.Network/networkSecurityGroups/projet-python-nsg" || true
          # Import VNet
          terraform -chdir=infra import azurerm_virtual_network.main "/subscriptions/$SUBSCRIPTION_ID/resourceGroups/projet-python-rg/providers/Microsoft.Network/virtualNetworks/projet-python-vnet" || true
          # Import Subnet
          terraform -chdir=infra import azurerm_subnet.main "/subscriptions/$SUBSCRIPTION_ID/resourceGroups/projet-python-rg/providers/Microsoft.Network/virtualNetworks/projet-python-vnet/subnets/projet-python-subnet" || true
          # Import NIC principale
          terraform -chdir=infra import azurerm_network_interface.main "/subscriptions/$SUBSCRIPTION_ID/resourceGroups/projet-python-rg/providers/Microsoft.Network/networkInterfaces/projet-python-nic" || true
          # Import NIC Grafana
          terraform -chdir=infra import azurerm_network_interface.grafana "/subscriptions/$SUBSCRIPTION_ID/resourceGroups/projet-python-rg/providers/Microsoft.Network/networkInterfaces/projet-grafana-nic" || true
          # Import association NSG <-> NIC principale
          terraform -chdir=infra import azurerm_network_interface_security_group_association.main "/subscriptions/$SUBSCRIPTION_ID/resourceGroups/projet-python-rg/providers/Microsoft.Network/networkInterfaces/projet-python-nic|/subscriptions/$SUBSCRIPTION_ID/resourceGroups/projet-python-rg/providers/Microsoft.Network/networkSecurityGroups/projet-python-nsg" || true
          # Import association NSG <-> NIC Grafana
          terraform -chdir=infra import azurerm_network_interface_security_group_association.grafana "/subscriptions/$SUBSCRIPTION_ID/resourceGroups/projet-python-rg/providers/Microsoft.Network/networkInterfaces/projet-grafana-nic|/subscriptions/$SUBSCRIPTION_ID/resourceGroups/projet-python-rg/providers/Microsoft.Network/networkSecurityGroups/projet-python-nsg" || true
          # Import VM Flask
          terraform -chdir=infra import azurerm_linux_virtual_machine.app "/subscriptions/$SUBSCRIPTION_ID/resourceGroups/projet-python-rg/providers/Microsoft.Compute/virtualMachines/projet-python-app-vm" || true
          # Import VM Grafana
          terraform -chdir=infra import azurerm_linux_virtual_machine.grafana "/subscriptions/$SUBSCRIPTION_ID/resourceGroups/projet-python-rg/providers/Microsoft.Compute/virtualMachines/projet-grafana-vm" || true
          # Import IP publique principale
          terraform -chdir=infra import azurerm_public_ip.main "/subscriptions/$SUBSCRIPTION_ID/resourceGroups/projet-python-rg/providers/Microsoft.Network/publicIPAddresses/projet-python-public-ip" || true
          # Import IP publique Grafana
          terraform -chdir=infra import azurerm_public_ip.grafana "/subscriptions/$SUBSCRIPTION_ID/resourceGroups/projet-python-rg/providers/Microsoft.Network/publicIPAddresses/projet-grafana-public-ip" || true
        shell: bash

      - name: Apply Terraform (création/MAJ des VMs)
        run: terraform -chdir=infra apply -auto-approve

      - name: Get App VM public IP
        id: get_ip
        run: |
          APP_IP=$(terraform -chdir=infra output -raw app_public_ip_address)
          GRAFANA_IP=$(terraform -chdir=infra output -raw grafana_public_ip_address)
          echo "APP_IP=$APP_IP" >> $GITHUB_ENV
          echo "GRAFANA_IP=$GRAFANA_IP" >> $GITHUB_ENV

      # --- Anciennes étapes de déploiement manuel (désormais gérées par Ansible/Docker) ---
      # - name: Copy Flask install script and app to VM
      #   run: |
      #     scp -o StrictHostKeyChecking=no infra/install_flask.sh azureuser@$APP_IP:/tmp/
      #     scp -o StrictHostKeyChecking=no release.zip azureuser@$APP_IP:/tmp/

      # - name: Install Flask app on VM
      #   run: |
      #     ssh -o StrictHostKeyChecking=no azureuser@$APP_IP 'bash /tmp/install_flask.sh'

      # - name: Copy Grafana install script to VM
      #   run: |
      #     scp -o StrictHostKeyChecking=no infra/install_grafana.sh azureuser@$GRAFANA_IP:/tmp/

      # - name: Install Grafana on VM
      #   run: |
      #     ssh -o StrictHostKeyChecking=no azureuser@$GRAFANA_IP 'bash /tmp/install_grafana.sh'

      # - name: Copy Prometheus install script to VM Grafana
      #   run: |
      #     scp -o StrictHostKeyChecking=no infra/install_prometheus.sh azureuser@$GRAFANA_IP:/tmp/

      # - name: Install Prometheus + node_exporter on VM Grafana
      #   run: |
      #     ssh -o StrictHostKeyChecking=no azureuser@$GRAFANA_IP 'bash /tmp/install_prometheus.sh'

      # - name: Générer le bloc Prometheus pour Flask
      #   run: |
      #     echo "  - job_name: \"flask_app\"" > flask_target.yml
      #     echo "    static_configs:" >> flask_target.yml
      #     echo "      - targets: [\"$APP_IP:5000\"]" >> flask_target.yml

      # - name: Injecter la cible Flask dans prometheus.yml sur la VM Grafana
      #   run: |
      #     scp -o StrictHostKeyChecking=no flask_target.yml azureuser@$GRAFANA_IP:/tmp/
      #     ssh -o StrictHostKeyChecking=no azureuser@$GRAFANA_IP '
      #       sudo sed -i "/scrape_configs:/r /tmp/flask_target.yml" /opt/prometheus/prometheus.yml
      #       sudo systemctl restart prometheus
      #     '

      - name: Installer Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible
          pip install ansible[azure]
          ansible-galaxy collection install community.docker

      - name: Ensure deploy_key exists for Ansible
        run: |
          mkdir -p infra
          echo "${{ secrets.DEPLOY_KEY }}" > infra/deploy_key
          chmod 600 infra/deploy_key


      - name: Vérifier et installer Python 3.9 sur les VMs
        run: |
          for ip in "$APP_IP" "$GRAFANA_IP"; do
            echo "Connexion à $ip"
            ssh -o StrictHostKeyChecking=no -i infra/deploy_key azureuser@$ip '
              if [ -x /usr/bin/python3.9 ]; then
                echo "Python 3.9 déjà installé"
              else
                echo "Installation de Python 3.9"
                sudo apt-get update
                sudo apt-get install -y software-properties-common
                sudo add-apt-repository -y ppa:deadsnakes/ppa
                sudo apt-get update
                sudo apt-get install -y python3.9
              fi
              ls -l /usr/bin/python3.9
              /usr/bin/python3.9 --version
            '
          done
        env:
          APP_IP: ${{ env.APP_IP }}
          GRAFANA_IP: ${{ env.GRAFANA_IP }}

      - name: Générer dynamiquement l'inventaire Ansible
        run: |
          echo "[flask]" > ansible/inventory.ini
          echo "app ansible_host=$APP_IP ansible_user=azureuser ansible_ssh_private_key_file=infra/deploy_key ansible_python_interpreter=/usr/bin/python3.9 ansible_ssh_common_args='-o StrictHostKeyChecking=no'" >> ansible/inventory.ini
          echo "" >> ansible/inventory.ini
          echo "[monitoring]" >> ansible/inventory.ini
          echo "monitoring ansible_host=$GRAFANA_IP ansible_user=azureuser ansible_ssh_private_key_file=infra/deploy_key ansible_python_interpreter=/usr/bin/python3.9 ansible_ssh_common_args='-o StrictHostKeyChecking=no'" >> ansible/inventory.ini
        env:
          APP_IP: ${{ env.APP_IP }}
          GRAFANA_IP: ${{ env.GRAFANA_IP }}

      - name: Ensure deploy_key exists for Ansible
        run: |
          mkdir -p infra
          echo "${{ secrets.DEPLOY_KEY }}" > infra/deploy_key
          chmod 600 infra/deploy_key

      - name: Déployer l'infra et les services avec Ansible (Docker)
        run: |
          ansible-playbook -i ansible/inventory.ini ansible/site.yml

      - name: Install integration test dependencies
        run: pip install requests

      - name: Run integration tests
        env:
          FLASK_IP: ${{ env.APP_IP }}
          GRAFANA_IP: ${{ env.GRAFANA_IP }}
          PROMETHEUS_IP: ${{ env.GRAFANA_IP }}
        run: |
          python3 integration_test.py
