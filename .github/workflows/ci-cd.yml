
name: Build and deploy Python app to Azure Web App - python-projet


on:
  push:
    branches:
      - main
      - infra-test
  workflow_dispatch:

  # Empêche le job de déploiement de tourner sur la branche infra-test
  # (le job "deploy" ne sera déclenché que sur main)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Set Azure credentials
      run: |
        echo "ARM_CLIENT_ID=${{ secrets.AZUREAPPSERVICE_CLIENTID }}" >> $GITHUB_ENV
        echo "ARM_CLIENT_SECRET=${{ secrets.AZUREAPPSERVICE_CLIENTSECRET }}" >> $GITHUB_ENV
        echo "ARM_SUBSCRIPTION_ID=${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID }}" >> $GITHUB_ENV
        echo "ARM_TENANT_ID=${{ secrets.AZUREAPPSERVICE_TENANTID }}" >> $GITHUB_ENV
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create and start virtual environment
        run: |
          python -m venv venv
          source venv/bin/activate
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
        
      - name: Run tests
        run: |
          python -m unittest discover

      - name: Zip artifact for deployment
        run: zip release.zip ./* -r

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            release.zip
            !venv/



  deploy:

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/infra-test' }}
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Unzip artifact for deployment
        run: unzip release.zip

      - name: Set Azure credentials
        run: |
          echo "ARM_CLIENT_ID=${{ secrets.AZUREAPPSERVICE_CLIENTID }}" >> $GITHUB_ENV
          echo "ARM_CLIENT_SECRET=${{ secrets.AZUREAPPSERVICE_CLIENTSECRET }}" >> $GITHUB_ENV
          echo "ARM_SUBSCRIPTION_ID=${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID }}" >> $GITHUB_ENV
          echo "ARM_TENANT_ID=${{ secrets.AZUREAPPSERVICE_TENANTID }}" >> $GITHUB_ENV

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
        env:
          SSH_KEY: ${{ secrets.SECRET_SSH_KEY }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Init Terraform
        run: terraform -chdir=infra init

      - name: Apply Terraform (création/MAJ des VMs)
        run: terraform -chdir=infra apply -auto-approve

      - name: Get App VM public IP
        id: get_ip
        run: |
          APP_IP=$(terraform -chdir=infra output -raw app_public_ip_address)
          GRAFANA_IP=$(terraform -chdir=infra output -raw grafana_public_ip_address)
          echo "APP_IP=$APP_IP" >> $GITHUB_ENV
          echo "GRAFANA_IP=$GRAFANA_IP" >> $GITHUB_ENV

      - name: Copy Flask install script and app to VM
        run: |
          scp -o StrictHostKeyChecking=no infra/install_flask.sh azureuser@$APP_IP:/tmp/
          scp -o StrictHostKeyChecking=no release.zip azureuser@$APP_IP:/tmp/

      - name: Install Flask app on VM
        run: |
          ssh -o StrictHostKeyChecking=no azureuser@$APP_IP 'bash /tmp/install_flask.sh'

      - name: Copy Grafana install script to VM
        run: |
          scp -o StrictHostKeyChecking=no infra/install_grafana.sh azureuser@$GRAFANA_IP:/tmp/

      - name: Install Grafana on VM
        run: |
          ssh -o StrictHostKeyChecking=no azureuser@$GRAFANA_IP 'bash /tmp/install_grafana.sh'
