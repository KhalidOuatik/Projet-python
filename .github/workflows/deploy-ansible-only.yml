name: Deploy only (Ansible & tests)

description: "Déployer uniquement l'app et relancer les tests sans toucher à l'infra Azure (rapide)"

on:
  push:
    branches:
      - main
      - develop
      - ansible-docker
      - image-registry
  workflow_dispatch:
    inputs:
      app_ip:
        description: "IP publique de la VM Flask (ex: 20.123.45.67)"
        required: true
      grafana_ip:
        description: "IP publique de la VM Grafana (ex: 20.123.45.68)"
        required: true
      flask_image:
        description: "Image Docker Flask à déployer (ex: ghcr.io/monorg/monrepo/flask-app:sha)"
        required: true

jobs:
  ansible_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
      - name: Unzip artifact for deployment
        run: unzip -o -qq release.zip
      - name: Installer Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible
          pip install ansible[azure]
          ansible-galaxy collection install community.docker
      - name: Ensure deploy_key exists for Ansible
        run: |
          mkdir -p infra
          echo "${{ secrets.DEPLOY_KEY }}" > infra/deploy_key
          chmod 600 infra/deploy_key
      - name: Générer dynamiquement l'inventaire Ansible
        run: |
          echo "[flask]" > ansible/inventory.ini
          echo "app ansible_host=${{ github.event.inputs.app_ip }} ansible_user=azureuser ansible_ssh_private_key_file=infra/deploy_key ansible_python_interpreter=/usr/bin/python3.9 ansible_ssh_common_args='-o StrictHostKeyChecking=no'" >> ansible/inventory.ini
          echo "" >> ansible/inventory.ini
          echo "[monitoring]" >> ansible/inventory.ini
          echo "monitoring ansible_host=${{ github.event.inputs.grafana_ip }} ansible_user=azureuser ansible_ssh_private_key_file=infra/deploy_key ansible_python_interpreter=/usr/bin/python3.9 ansible_ssh_common_args='-o StrictHostKeyChecking=no'" >> ansible/inventory.ini
      - name: Générer prometheus.yml dynamique avec IP Flask
        run: |
          echo "global:" > docker/prometheus.yml
          echo "  scrape_interval: 15s" >> docker/prometheus.yml
          echo "scrape_configs:" >> docker/prometheus.yml
          echo "  - job_name: 'prometheus'" >> docker/prometheus.yml
          echo "    static_configs:" >> docker/prometheus.yml
          echo "      - targets: ['localhost:9090']" >> docker/prometheus.yml
          echo "  - job_name: 'flask'" >> docker/prometheus.yml
          echo "    static_configs:" >> docker/prometheus.yml
          echo "      - targets: ['flask:5000']" >> docker/prometheus.yml
          echo "  - job_name: 'node_exporter'" >> docker/prometheus.yml
          echo "    static_configs:" >> docker/prometheus.yml
          echo "      - targets: ['${{ github.event.inputs.app_ip }}:9100']" >> docker/prometheus.yml
      - name: Exporter FLASK_IMAGE pour Ansible
        run: |
          echo "FLASK_IMAGE=${{ github.event.inputs.flask_image }}" >> $GITHUB_ENV

      - name: Déployer l'infra et les services avec Ansible (Docker)
        env:
          FLASK_IMAGE: ${{ github.event.inputs.flask_image }}
        run: |
          ansible-playbook -i ansible/inventory.ini ansible/site.yml
      - name: Install integration test dependencies
        run: pip install requests
      - name: Run integration tests
        env:
          FLASK_IP: ${{ github.event.inputs.app_ip }}
          GRAFANA_IP: ${{ github.event.inputs.grafana_ip }}
          PROMETHEUS_IP: ${{ github.event.inputs.grafana_ip }}
        run: |
          python3 app/integration_test.py
