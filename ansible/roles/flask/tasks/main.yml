---
# Rôle Flask : build et run le conteneur Flask
- name: Copier le code Flask sur la VM
  synchronize:
    src: ../../..
    dest: /opt/flask_app
    rsync_opts:
      - "--exclude=.git"
      - "--exclude=venv"
      - "--exclude=__pycache__"
      - "--exclude=ansible"
      - "--exclude=docker"

- name: Créer le dossier /opt/flask_app sur la VM
  ansible.builtin.file:
    path: /opt/flask_app
    state: directory
    owner: "{{ ansible_user | default('azureuser') }}"
    mode: '0755'

- name: Copier le Dockerfile racine dans le dossier Flask
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../Dockerfile"
    dest: /opt/flask_app/Dockerfile
    mode: '0644'

- name: Construire l'image Flask
  community.docker.docker_image:
    build:
      path: /opt/flask_app
    name: flask-app
    tag: latest

- name: Lancer le conteneur Flask
  community.docker.docker_container:
    name: flask
    image: flask-app:latest
    state: started
    restart_policy: always
    published_ports:
      - "5000:5000"

- name: Vérifier que le conteneur Flask tourne
  community.docker.docker_container_info:
    name: flask
  register: flask_container_info

- name: Afficher l'état du conteneur Flask
  ansible.builtin.debug:
    msg: "Conteneur Flask running: {{ flask_container_info.containers[0].State.Running if flask_container_info.containers else 'absent' }}"
