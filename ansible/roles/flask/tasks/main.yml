---
# Rôle Flask : run le conteneur Flask depuis la registry GHCR
- name: Lancer le conteneur Flask depuis la registry
  community.docker.docker_container:
    name: flask
    image: "{{ lookup('env', 'FLASK_IMAGE') | default('ghcr.io/<owner>/<repo>/flask-app:latest', true) }}"
    state: started
    restart_policy: always
    published_ports:
      - "5000:5000"

