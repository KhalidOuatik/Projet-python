---
# Rôle Grafana/Prometheus/node_exporter via docker-compose
- name: Créer le dossier /opt/monitoring sur la VM
  ansible.builtin.file:
    path: /opt/monitoring
    state: directory
    owner: "{{ ansible_user | default('azureuser') }}"
    mode: '0755'

- name: Copier le dossier docker/ sur la VM
  synchronize:
    src: ../../docker/
    dest: /opt/monitoring/
    rsync_opts:
      - "--exclude=.git"

- name: Copier les fichiers docker-compose et prometheus.yml
  ansible.builtin.import_tasks: compose_copy.yml

- name: Lancer le stack docker-compose (v2)
  community.docker.docker_compose_v2:
    project_src: /opt/monitoring
    state: present

- name: Vérifier que les conteneurs Grafana, Prometheus et node_exporter tournent
  community.docker.docker_container_info:
    name: [grafana, prometheus, node_exporter]
  register: monitoring_containers_info

- name: Afficher l'état des conteneurs Grafana/Prometheus/node_exporter
  ansible.builtin.debug:
    msg: |
      Grafana running: {{ (monitoring_containers_info.containers | selectattr('Name', 'search', 'grafana') | list)[0].State.Running if (monitoring_containers_info.containers | selectattr('Name', 'search', 'grafana') | list) else 'absent' }}
      Prometheus running: {{ (monitoring_containers_info.containers | selectattr('Name', 'search', 'prometheus') | list)[0].State.Running if (monitoring_containers_info.containers | selectattr('Name', 'search', 'prometheus') | list) else 'absent' }}
      node_exporter running: {{ (monitoring_containers_info.containers | selectattr('Name', 'search', 'node_exporter') | list)[0].State.Running if (monitoring_containers_info.containers | selectattr('Name', 'search', 'node_exporter') | list) else 'absent' }}
