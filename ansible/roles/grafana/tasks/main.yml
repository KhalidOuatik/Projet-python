---
# Rôle Grafana/Prometheus/node_exporter via docker-compose
- name: Créer le dossier /opt/monitoring sur la VM
  ansible.builtin.file:
    path: /opt/monitoring
    state: directory
    owner: "{{ ansible_user | default('azureuser') }}"
    mode: '0755'

- name: Copier le dossier docker/ sur la VM
  synchronize:
    src: ../../docker/
    dest: /opt/monitoring/
    rsync_opts:
      - "--exclude=.git"

- name: Copier tout le dossier docker/ (fichiers essentiels uniquement) sur la VM
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../docker/"
    dest: /opt/monitoring/
    mode: '0644'
    directory_mode: '0755'
    remote_src: false
    exclude:
      - .git
      - __pycache__
      - '*.md'
      - '*.yml'
      - '*.yaml'
      - '*.ini'
      - '*.zip'

- name: Lancer le stack docker-compose (v2)
  community.docker.docker_compose_v2:
    project_src: /opt/monitoring
    state: present
