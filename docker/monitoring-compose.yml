version: '3.8'
services:
  grafana:
    image: ${GRAFANA_IMAGE:-ghcr.io/<owner>/<repo>/grafana:latest}
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
  prometheus:
    image: ${PROMETHEUS_IMAGE:-ghcr.io/<owner>/<repo>/prometheus:latest}
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
  node_exporter:
    image: prom/node-exporter:latest
    ports:
      - "9100:9100"
