version: '3.8'
services:
  flask:
    build: ../
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
    depends_on:
      - prometheus
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
  node_exporter:
    image: prom/node-exporter:latest
    ports:
      - "9100:9100"
